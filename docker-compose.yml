services:
  mysql-users:
    image: mysql:8.0
    container_name: mysql-users-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
      MYSQL_USER: dmh_user
      MYSQL_PASSWORD: dmh_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-users-volume:/var/lib/mysql
    networks:
      - dmh-network

  mysql-accounts:
    image: mysql:8.0
    container_name: mysql-accounts-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: accounts_db
      MYSQL_USER: dmh_user
      MYSQL_PASSWORD: dmh_password
    ports:
      - "3308:3306"
    volumes:
      - mysql-accounts-volume:/var/lib/mysql
    networks:
      - dmh-network

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: dmh/eureka-server:1.0.0
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - mysql-users
      - mysql-accounts
    networks:
      - dmh-network
    environment:
      SPRING_PROFILES_ACTIVE: docker

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: dmh/api-gateway:1.0.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - dmh-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: dmh/auth-service:1.0.0
    container_name: auth-service
    ports:
      - "8088:8088"
    depends_on:
      - eureka-server
      - mysql-users
    networks:
      - dmh-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-users:3306/users_db
      SPRING_DATASOURCE_USERNAME: dmh_user
      SPRING_DATASOURCE_PASSWORD: dmh_password

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    image: dmh/users-service:1.0.0
    container_name: users-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - mysql-users
    networks:
      - dmh-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-users:3306/users_db
      SPRING_DATASOURCE_USERNAME: dmh_user
      SPRING_DATASOURCE_PASSWORD: dmh_password

  accounts-service:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    image: dmh/accounts-service:1.0.0
    container_name: accounts-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - mysql-accounts
    networks:
      - dmh-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-accounts:3306/accounts_db
      SPRING_DATASOURCE_USERNAME: dmh_user
      SPRING_DATASOURCE_PASSWORD: dmh_password

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dmh/frontend:1.0.0
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - dmh-network

volumes:
  mysql-users-volume:
  mysql-accounts-volume:

networks:
  dmh-network:
    driver: bridge